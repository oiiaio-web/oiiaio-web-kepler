name: Build Multi-Platform Wheels
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel
      - name: Build wheel
        run: python -m build --wheel
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-wheel
          path: dist/*.whl

  build_linux_aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Build aarch64 wheel
        uses: docker://quay.io/pypa/manylinux2014_aarch64
        with:
          args: |
            bash -c "
            /opt/python/cp38-cp38/bin/pip install --upgrade pip build wheel &&
            /opt/python/cp38-cp38/bin/python -m build --wheel &&
            mkdir -p /github/workspace/dist_aarch64 &&
            cp dist/*.whl /github/workspace/dist_aarch64/
            "
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64-wheel
          path: dist_aarch64/*.whl

  build_macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel
      - name: Build wheel
        run: python -m build --wheel
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-wheel
          path: dist/*.whl
